      /* ══════════════════════════════════════════════════════════════
   5 · AUDIO ENGINE — Web Audio API
   Each record is a generative composition synthesized live, so the
   whole experience ships with zero audio files. Gain, tilt-EQ tone
   control, crackle and playback-speed all run through real nodes.
   ══════════════════════════════════════════════════════════════ */
      const Audio = (() => {
        let ctx = null,
          master,
          lowShelf,
          highShelf,
          comp,
          crackleGain,
          musicGain;
        let crackleSrc = null;
        let mediaEl = null,
          mediaSrc = null;
        const S = {
          volume: 0.75,
          tone: 0.5,
          speedFactor: 1,
          playing: false,
          media: false,
        };

        function ensure() {
          if (ctx) return ctx;
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain();
          master.gain.value = S.volume;
          lowShelf = ctx.createBiquadFilter();
          lowShelf.type = "lowshelf";
          lowShelf.frequency.value = 280;
          highShelf = ctx.createBiquadFilter();
          highShelf.type = "highshelf";
          highShelf.frequency.value = 2800;
          comp = ctx.createDynamicsCompressor();
          comp.threshold.value = -16;
          comp.ratio.value = 3;
          comp.knee.value = 18;
          musicGain = ctx.createGain();
          musicGain.gain.value = 0;
          musicGain.connect(lowShelf);
          lowShelf.connect(highShelf);
          highShelf.connect(comp);
          comp.connect(master);
          master.connect(ctx.destination);
          // vinyl crackle bed
          crackleGain = ctx.createGain();
          crackleGain.gain.value = 0;
          const len = ctx.sampleRate * 3,
            buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) {
            d[i] = (Math.random() * 2 - 1) * 0.028; // hiss
            if (Math.random() < 0.0007) d[i] += (Math.random() * 2 - 1) * 0.85; // pops
            if (Math.random() < 0.004) d[i] += (Math.random() * 2 - 1) * 0.22; // ticks
          }
          crackleSrc = ctx.createBufferSource();
          crackleSrc.buffer = buf;
          crackleSrc.loop = true;
          const bp = ctx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 3400;
          bp.Q.value = 0.5;
          crackleSrc.connect(bp);
          bp.connect(crackleGain);
          crackleGain.connect(master);
          crackleSrc.start();
          // real-audio path: an <audio> element for streamed tracks (e.g. the
          // Audius trending feed), routed through the SAME warm chain
          // (musicGain → tilt-EQ → compressor → master) so tone, volume and
          // the vinyl crackle bed all apply to real songs exactly as they do
          // to the synthesized records. window.Audio dodges the module-scoped
          // `Audio` binding (this very IIFE), which is still in its TDZ here.
          mediaEl = new window.Audio();
          mediaEl.crossOrigin = "anonymous";
          mediaEl.preload = "auto";
          mediaSrc = ctx.createMediaElementSource(mediaEl);
          mediaSrc.connect(musicGain);
          applyTone(S.tone);
          return ctx;
        }
        function seekMedia(sec) {
          if (!mediaEl) return;
          const apply = () => {
            try {
              mediaEl.currentTime = Math.max(0, sec || 0);
            } catch (e) {}
          };
          if (mediaEl.readyState >= 1) apply();
          else mediaEl.addEventListener("loadedmetadata", apply, { once: true });
        }
        const now = () => (ctx ? ctx.currentTime : 0);

        /* ——— tiny instrument kit ——— */
        const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
        function env(g, t, a, peak, dec, sus = 0) {
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(peak, t + a);
          g.gain.exponentialRampToValueAtTime(
            Math.max(sus, 0.0001),
            t + a + dec,
          );
        }
        function pluck(
          midi,
          t,
          {
            type = "triangle",
            peak = 0.16,
            dec = 0.9,
            cutoff = 2200,
            detune = 0,
          } = {},
        ) {
          const o = ctx.createOscillator(),
            g = ctx.createGain(),
            f = ctx.createBiquadFilter();
          o.type = type;
          o.frequency.value = mtof(midi);
          o.detune.value = detune;
          f.type = "lowpass";
          f.frequency.setValueAtTime(cutoff, t);
          f.frequency.exponentialRampToValueAtTime(
            Math.max(cutoff * 0.25, 120),
            t + dec,
          );
          env(g, t, 0.006, peak, dec);
          o.connect(f);
          f.connect(g);
          g.connect(musicGain);
          o.start(t);
          o.stop(t + dec + 0.3);
        }
        function keys(midi, t, { peak = 0.11, dec = 1.6 } = {}) {
          // e-piano: sine + soft overtone + tremolo
          const g = ctx.createGain();
          env(g, t, 0.008, peak, dec);
          const tr = ctx.createGain();
          tr.gain.value = 1;
          const lfo = ctx.createOscillator();
          lfo.frequency.value = 4.3;
          const lg = ctx.createGain();
          lg.gain.value = 0.14;
          lfo.connect(lg);
          lg.connect(tr.gain);
          lfo.start(t);
          lfo.stop(t + dec + 0.4);
          [
            [1, "sine", 1],
            [2, "sine", 0.32],
            [3.98, "sine", 0.07],
          ].forEach(([mul, type, amt]) => {
            const o = ctx.createOscillator();
            o.type = type;
            o.frequency.value = mtof(midi) * mul;
            const og = ctx.createGain();
            og.gain.value = amt;
            o.connect(og);
            og.connect(tr);
            o.start(t);
            o.stop(t + dec + 0.4);
          });
          tr.connect(g);
          g.connect(musicGain);
        }
        function bass(
          midi,
          t,
          { peak = 0.2, dec = 0.55, type = "triangle" } = {},
        ) {
          const o = ctx.createOscillator(),
            g = ctx.createGain(),
            f = ctx.createBiquadFilter();
          o.type = type;
          o.frequency.value = mtof(midi);
          f.type = "lowpass";
          f.frequency.value = 520;
          env(g, t, 0.01, peak, dec, 0.001);
          o.connect(f);
          f.connect(g);
          g.connect(musicGain);
          o.start(t);
          o.stop(t + dec + 0.25);
        }
        function pad(
          midis,
          t,
          { peak = 0.05, att = 1.4, hold = 2.6, rel = 1.6, cutoff = 1200 } = {},
        ) {
          midis.forEach((mi) => {
            [-6, 5].forEach((det) => {
              const o = ctx.createOscillator(),
                g = ctx.createGain(),
                f = ctx.createBiquadFilter();
              o.type = "sawtooth";
              o.frequency.value = mtof(mi);
              o.detune.value = det;
              f.type = "lowpass";
              f.frequency.value = cutoff;
              f.Q.value = 0.4;
              g.gain.setValueAtTime(0.0001, t);
              g.gain.linearRampToValueAtTime(peak, t + att);
              g.gain.setValueAtTime(peak, t + att + hold);
              g.gain.linearRampToValueAtTime(0.0001, t + att + hold + rel);
              o.connect(f);
              f.connect(g);
              g.connect(musicGain);
              o.start(t);
              o.stop(t + att + hold + rel + 0.1);
            });
          });
        }
        function noiseHit(
          t,
          { peak = 0.05, dec = 0.09, freq = 6800, q = 1.2 } = {},
        ) {
          // ride / hat / snare colouring
          const len = ctx.sampleRate * 0.25,
            b = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          const s = ctx.createBufferSource();
          s.buffer = b;
          const f = ctx.createBiquadFilter();
          f.type = "bandpass";
          f.frequency.value = freq;
          f.Q.value = q;
          const g = ctx.createGain();
          env(g, t, 0.002, peak, dec);
          s.connect(f);
          f.connect(g);
          g.connect(musicGain);
          s.start(t);
          s.stop(t + dec + 0.15);
        }
        function kick(t, { peak = 0.22 } = {}) {
          const o = ctx.createOscillator(),
            g = ctx.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(120, t);
          o.frequency.exponentialRampToValueAtTime(38, t + 0.11);
          env(g, t, 0.003, peak, 0.24);
          o.connect(g);
          g.connect(musicGain);
          o.start(t);
          o.stop(t + 0.4);
        }
        function horn(midi, t, { peak = 0.07, dec = 1.1 } = {}) {
          // muted-trumpet-ish lead
          const o = ctx.createOscillator(),
            g = ctx.createGain(),
            f = ctx.createBiquadFilter();
          o.type = "sawtooth";
          o.frequency.value = mtof(midi);
          const vib = ctx.createOscillator();
          vib.frequency.value = 5.2;
          const vg = ctx.createGain();
          vg.gain.value = 4;
          vib.connect(vg);
          vg.connect(o.frequency);
          vib.start(t);
          vib.stop(t + dec + 0.3);
          f.type = "bandpass";
          f.frequency.value = 920;
          f.Q.value = 1.6;
          env(g, t, 0.06, peak, dec);
          o.connect(f);
          f.connect(g);
          g.connect(musicGain);
          o.start(t);
          o.stop(t + dec + 0.3);
        }

        /* ——— generative composer, one grammar per record ——— */
        // chord degrees on a root: [semitone offsets]
        const CH = {
          m7: [0, 3, 7, 10],
          M7: [0, 4, 7, 11],
          d7: [0, 4, 7, 10],
          m9: [0, 3, 7, 10, 14],
          M9: [0, 4, 7, 11, 14],
          sus: [0, 5, 7, 10],
          m6: [0, 3, 7, 9],
        };
        const PROGS = {
          jazz: [
            ["m9", 0],
            ["m9", 0],
            ["m7", 5],
            ["d7", 10],
            ["m9", 0],
            ["m6", -4],
            ["m7", 5],
            ["d7", 7],
          ],
          ambient: [
            ["M9", 0],
            ["m9", 9],
            ["M7", 5],
            ["sus", 7],
          ],
          piano: [
            ["M7", 0],
            ["m7", 9],
            ["M7", 5],
            ["sus", 7],
            ["M7", 0],
            ["m7", 4],
            ["m7", 9],
            ["sus", 7],
          ],
          synth: [
            ["m9", 0],
            ["m9", 0],
            ["M7", 8],
            ["sus", 10],
          ],
          folk: [
            ["M7", 0],
            ["M7", 5],
            ["m7", 9],
            ["sus", 7],
          ],
          lofi: [
            ["m9", 0],
            ["M9", 3],
            ["m9", 8],
            ["d7", 10],
          ],
        };
        const seq = { album: null, step: 0, nextT: 0, timer: null };
        const SPB = () => 60 / (seq.album.bpm * S.speedFactor) / 4; // seconds per 16th

        function chordAt(bar) {
          const prog = PROGS[seq.album.style];
          const [kind, off] = prog[bar % prog.length];
          return CH[kind].map((s) => seq.album.root + off + s);
        }
        function scheduleStep(step, t) {
          const a = seq.album,
            bar = (step / 16) | 0,
            s16 = step % 16,
            ch = chordAt(bar);
          const R = Math.random;
          switch (a.style) {
            case "jazz": {
              const swing = s16 % 4 === 2 ? SPB() * 0.32 : 0;
              if (s16 % 4 === 0)
                noiseHit(t, { peak: 0.045, freq: 7200, dec: 0.16 }); // ride
              if (s16 % 4 === 2)
                noiseHit(t + swing, { peak: 0.028, freq: 8600, dec: 0.07 }); // swung skip
              if (s16 % 4 === 0) {
                // walking bass
                const opts = [
                  ch[0] - 12,
                  ch[1] - 12,
                  ch[2] - 12,
                  ch[0] - 10,
                  ch[3] - 12,
                ];
                bass(opts[(R() * opts.length) | 0], t, {
                  peak: 0.17,
                  dec: 0.5,
                });
              }
              if (s16 === 0 && bar % 2 === 0)
                ch.slice(1).forEach((m, i) =>
                  keys(m, t + i * 0.012, { peak: 0.05, dec: 1.9 }),
                );
              if (s16 === 8 && R() < 0.65) {
                // horn phrase
                const lick = [ch[3] + 12, ch[2] + 12, ch[1] + 12, ch[3] + 10];
                lick
                  .slice(0, 2 + ((R() * 3) | 0))
                  .forEach((m, i) =>
                    horn(m, t + i * SPB() * 2, { peak: 0.055, dec: 0.7 }),
                  );
              }
              break;
            }
            case "ambient": {
              if (s16 === 0)
                pad(
                  ch.map((m) => m - 0),
                  t,
                  { peak: 0.055, att: 2.2, hold: 3.4, rel: 2.4, cutoff: 900 },
                );
              if (s16 === 0)
                bass(ch[0] - 24, t, { peak: 0.1, dec: 3.2, type: "sine" });
              if (s16 % 8 === 4 && R() < 0.55)
                keys(ch[(R() * ch.length) | 0] + 24, t, {
                  peak: 0.035,
                  dec: 3,
                });
              break;
            }
            case "piano": {
              const arp = [0, 2, 1, 3, 2, 4 % ch.length, 1, 2];
              if (s16 % 2 === 0)
                pluck(ch[arp[(s16 / 2) % 8]], t, {
                  type: "sine",
                  peak: 0.1,
                  dec: 1.5,
                  cutoff: 3000,
                });
              if (s16 === 0)
                bass(ch[0] - 12, t, { peak: 0.09, dec: 1.8, type: "sine" });
              if (s16 === 0 && bar % 2 === 1)
                keys(ch[3] + 12, t, { peak: 0.05, dec: 2.4 });
              break;
            }
            case "synth": {
              if (s16 % 2 === 0)
                bass(ch[0] - 12 + (s16 % 8 === 6 ? 7 : 0), t, {
                  peak: 0.16,
                  dec: 0.22,
                  type: "square",
                });
              if (s16 % 4 === 2)
                noiseHit(t, { peak: 0.03, freq: 9000, dec: 0.05 });
              if (s16 % 8 === 4)
                noiseHit(t, { peak: 0.05, freq: 2400, q: 0.8, dec: 0.14 });
              if (s16 === 0)
                pad(ch, t, {
                  peak: 0.04,
                  att: 0.8,
                  hold: 2.4,
                  rel: 1.4,
                  cutoff: 1500,
                });
              if (s16 === 0 && bar % 4 === 0) kick(t, { peak: 0.16 });
              break;
            }
            case "folk": {
              const strum = [0, 1, 2, 3, 2, 1];
              if (s16 % 2 === 0)
                pluck(ch[strum[(s16 / 2) % 6]], t + R() * 0.012, {
                  type: "triangle",
                  peak: 0.11,
                  dec: 1.1,
                  cutoff: 2600,
                });
              if (s16 === 0) bass(ch[0] - 12, t, { peak: 0.12, dec: 0.9 });
              if (s16 === 8) bass(ch[2] - 12, t, { peak: 0.09, dec: 0.8 });
              break;
            }
            case "lofi": {
              if (s16 === 0 || s16 === 10) kick(t, { peak: 0.2 });
              if (s16 === 4 || s16 === 12)
                noiseHit(t, { peak: 0.07, freq: 1900, q: 0.9, dec: 0.13 });
              if (s16 % 2 === 0)
                noiseHit(t + (s16 % 4 === 2 ? SPB() * 0.4 : 0), {
                  peak: 0.018,
                  freq: 8200,
                  dec: 0.04,
                });
              if (s16 === 0)
                ch.forEach((m, i) =>
                  keys(m, t + i * 0.02, { peak: 0.055, dec: 2.2 }),
                );
              if (s16 === 14 && R() < 0.4)
                keys(ch[3] + 12, t, { peak: 0.04, dec: 1.4 });
              break;
            }
          }
        }
        function pump() {
          if (!S.playing || !seq.album) return;
          const horizon = now() + 0.14;
          while (seq.nextT < horizon) {
            scheduleStep(seq.step, seq.nextT);
            seq.nextT += SPB();
            seq.step++;
          }
        }
        return {
          ensure,
          play(album, startAt = 0) {
            ensure();
            if (ctx.state === "suspended") ctx.resume();
            musicGain.gain.cancelScheduledValues(now());
            musicGain.gain.setTargetAtTime(1, now(), 0.5);
            crackleGain.gain.setTargetAtTime(0.55, now(), 0.4);
            if (album.streamUrl) {
              // real streamed track → drive the <audio> element, silence the
              // synth sequencer.
              S.media = true;
              clearInterval(seq.timer);
              seq.album = null;
              if (mediaEl.src !== album.streamUrl) mediaEl.src = album.streamUrl;
              mediaEl.playbackRate = S.speedFactor;
              seekMedia(startAt);
              mediaEl.play().catch(() => {});
            } else {
              // procedural fallback: generative synth composition.
              S.media = false;
              if (mediaEl) mediaEl.pause();
              seq.album = album;
              seq.step = 0;
              seq.nextT = now() + 0.06;
              clearInterval(seq.timer);
              seq.timer = setInterval(pump, 30);
            }
            S.playing = true;
          },
          stop(fast = false) {
            S.playing = false;
            clearInterval(seq.timer);
            if (mediaEl) mediaEl.pause();
            if (!ctx) return;
            const k = fast ? 0.12 : 0.5;
            musicGain.gain.setTargetAtTime(0, now(), k);
            crackleGain.gain.setTargetAtTime(0, now(), k * 1.4);
          },
          seek(sec) {
            if (S.media) seekMedia(sec);
          },
          mediaActive: () => S.media && S.playing,
          mediaTime: () => (mediaEl ? mediaEl.currentTime : 0),
          mediaEnded: () => !!(mediaEl && mediaEl.ended),
          setVolume(v) {
            S.volume = v;
            if (ctx) master.gain.setTargetAtTime(v * v, now(), 0.05);
          },
          setTone(v) {
            S.tone = v;
            if (ctx) applyTone(v);
          },
          setSpeed(f) {
            S.speedFactor = f;
            if (mediaEl) mediaEl.playbackRate = f;
          },
          seekRestart() {
            if (S.media) return; // media seeking is handled via seek()
            if (S.playing && seq.album) {
              seq.step = 0;
              seq.nextT = now() + 0.05;
            }
          },
          get playing() {
            return S.playing;
          },
          state: S,
        };
        function applyTone(v) {
          const t = (v - 0.5) * 2; // −1 … +1
          lowShelf.gain.setTargetAtTime(-t * 7, now(), 0.05);
          highShelf.gain.setTargetAtTime(t * 8, now(), 0.05);
        }
      })();

      /* ══════════════════════════════════════════════════════════════
   6 · TRANSPORT — motor physics, tonearm choreography, track clock
   ══════════════════════════════════════════════════════════════ */
      const T = {
        albumIdx: 0,
        state: "stopped", // stopped | cueing | playing | parking | swapping
        omega: 0, // rad/s (actual)
        rpm: 100 / 3, // 33⅓ or 45
        motorOn: false,
        time: 0, // track position, seconds
        wow: 0,
      };
      const rpmToOmega = (rpm) => (rpm / 60) * Math.PI * 2;
      const album = () => ALBUMS[T.albumIdx];

      const armTL = {
        tl: null,
        kill() {
          if (this.tl) {
            this.tl.kill();
            this.tl = null;
          }
          gsap.killTweensOf(armYaw.rotation);
          gsap.killTweensOf(armLift.rotation);
          gsap.killTweensOf(cueLever.rotation);
        },
      };

      function cueAndPlay() {
        if (
          T.state === "playing" ||
          T.state === "cueing" ||
          T.state === "swapping"
        )
          return;
        Audio.ensure();
        T.state = "cueing";
        T.motorOn = true;
        armTL.kill();
        const tl = gsap.timeline({
          onComplete() {
            T.state = "playing";
            Audio.play(album(), T.time);
          },
        });
        armTL.tl = tl;
        tl.to(
          cueLever.rotation,
          { x: 0.55, duration: 0.3, ease: "power2.out" },
          0,
        )
          .to(
            armLift.rotation,
            { x: LIFT_UP, duration: 0.5, ease: "power2.inOut" },
            0,
          )
          .to(
            armYaw.rotation,
            {
              y: yawForProgress(T.time / album().dur),
              duration: 1.15,
              ease: "power2.inOut",
            },
            0.25,
          )
          .to(
            cueLever.rotation,
            { x: 0, duration: 0.85, ease: "power2.inOut" },
            1.35,
          )
          .to(
            armLift.rotation,
            { x: LIFT_DOWN, duration: 0.85, ease: "power3.in" },
            1.35,
          );
        setPlayUI(true);
      }
      function parkAndStop() {
        if (T.state === "stopped" || T.state === "parking") return;
        T.state = "parking";
        Audio.stop();
        armTL.kill();
        const tl = gsap.timeline({
          onComplete() {
            T.state = "stopped";
          },
        });
        armTL.tl = tl;
        tl.to(
          cueLever.rotation,
          { x: 0.55, duration: 0.35, ease: "power2.out" },
          0,
        )
          .to(
            armLift.rotation,
            { x: LIFT_UP, duration: 0.55, ease: "power2.out" },
            0,
          )
          .to(
            armYaw.rotation,
            { y: YAW_REST, duration: 1.2, ease: "power2.inOut" },
            0.35,
          )
          .add(() => {
            T.motorOn = false;
          }, 0.5);
        setPlayUI(false);
      }
      function yawForProgress(p) {
        // stylus tracks inward across the side
        return (
          YAW_OUTER + (YAW_INNER - YAW_OUTER) * THREE.MathUtils.clamp(p, 0, 1)
        );
      }

      /* — album switching: full mechanical swap — */
      function loadAlbum(i, force = false) {
        i = (i + ALBUMS.length) % ALBUMS.length;
        if (i === T.albumIdx) {
          if (force && T.state === "stopped") cueAndPlay();
          return;
        }
        const wasPlaying =
          force || T.state === "playing" || T.state === "cueing";
        T.albumIdx = i;
        T.time = 0;
        const a = album();
        updateNowPlaying(a);
        markActiveCard(a.id);
        Audio.stop(true);
        T.state = "swapping";
        armTL.kill();
        gsap.killTweensOf(recordGroup.position);
        gsap.killTweensOf(recordGroup.rotation);
        const tl = gsap.timeline({
          onComplete() {
            T.state = "stopped";
            if (wasPlaying) cueAndPlay();
            else setPlayUI(false);
          },
        });
        armTL.tl = tl;
        tl.to(
          cueLever.rotation,
          { x: 0.55, duration: 0.3, ease: "power2.out" },
          0,
        )
          .to(
            armLift.rotation,
            { x: LIFT_UP, duration: 0.45, ease: "power2.out" },
            0,
          )
          .to(
            armYaw.rotation,
            { y: YAW_REST, duration: 0.9, ease: "power2.inOut" },
            0.2,
          )
          .add(() => {
            T.motorOn = false;
          }, 0.25)
          // old record lifts off the spindle…
          .to(
            recordGroup.position,
            { y: 1.15, duration: 0.7, ease: "power2.in" },
            0.55,
          )
          .to(
            recordGroup.rotation,
            { z: 0.1, duration: 0.7, ease: "power1.in" },
            0.55,
          )
          .add(() => {
            labelMat.map = ctex(makeLabel(a));
            labelMat.needsUpdate = true;
          }, 1.3)
          // …new record drops with a tiny bounce
          .to(
            recordGroup.rotation,
            { z: 0, duration: 0.55, ease: "power1.out" },
            1.35,
          )
          .to(
            recordGroup.position,
            { y: 0, duration: 0.75, ease: "bounce.out" },
            1.4,
          );
      }
      function setPlayUI(playing) {
        document.getElementById("iconPlay").style.display = playing
          ? "none"
          : "block";
        document.getElementById("iconPause").style.display = playing
          ? "block"
          : "none";
        document
          .getElementById("playBtn")
          .setAttribute("aria-label", playing ? "Pause" : "Play");
      }

      /* ══════════════════════════════════════════════════════════════
   7 · INTERACTION — drag-rotate, 3D knobs, buttons, camera
   ══════════════════════════════════════════════════════════════ */
      const raycaster = new THREE.Raycaster(),
        pointer = new THREE.Vector2();
      const pickables = [volKnob, toneKnob, startBtn, speedKnob];
      const drag = {
        mode: null,
        x: 0,
        y: 0,
        vx: 0,
        targetY: 0,
        targetX: 0,
        knob: null,
        startVal: 0,
      };
      drag.targetY = player.rotation.y;
      const HOME_Y = 0,
        HOME_X = 0;
      const mouse = { x: 0, y: 0 };
      const reduceMotion = matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;

      function pick(e) {
        const r = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(pickables, true);
        if (!hits.length) return null;
        let o = hits[0].object;
        while (o.parent) {
          if (o === volKnob) return { kind: "vol", obj: volKnob };
          if (o === toneKnob) return { kind: "tone", obj: toneKnob };
          if (o === startBtn) return { kind: "start", obj: startBtn };
          if (o === speedKnob) return { kind: "speed", obj: speedKnob };
          o = o.parent;
        }
        return null;
      }
      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        const hit = pick(e);
        drag.x = e.clientX;
        drag.y = e.clientY;
        drag.vx = 0;
        if (hit && (hit.kind === "vol" || hit.kind === "tone")) {
          drag.mode = "knob";
          drag.knob = hit.kind;
          drag.startVal =
            hit.kind === "vol" ? Audio.state.volume : Audio.state.tone;
          canvas.classList.add("knob");
        } else if (hit && hit.kind === "start") {
          drag.mode = "press";
          pressStartButton();
        } else if (hit && hit.kind === "speed") {
          drag.mode = "press";
          setSpeed(T.rpm > 40 ? 33 : 45);
        } else {
          drag.mode = "orbit";
          canvas.classList.add("grabbing");
          document.getElementById("dragHint").classList.add("hide");
        }
      });
      canvas.addEventListener("pointermove", (e) => {
        mouse.x = (e.clientX / innerWidth) * 2 - 1;
        mouse.y = (e.clientY / innerHeight) * 2 - 1;
        if (drag.mode === "orbit") {
          const dx = e.clientX - drag.x,
            dy = e.clientY - drag.y;
          drag.targetY += dx * 0.006;
          drag.vx = dx * 0.006;
          drag.targetX = THREE.MathUtils.clamp(
            drag.targetX + dy * 0.002,
            -0.1,
            0.16,
          );
          drag.x = e.clientX;
          drag.y = e.clientY;
        } else if (drag.mode === "knob") {
          const dy = drag.y - e.clientY;
          const v = THREE.MathUtils.clamp(drag.startVal + dy * 0.006, 0, 1);
          if (drag.knob === "vol") {
            Audio.setVolume(v);
            syncVolUI(v);
            volKnob.rotation.y = -(v - 0.5) * 4.2;
          } else {
            Audio.setTone(v);
            toneKnob.rotation.y = -(v - 0.5) * 4.2;
          }
        } else if (drag.mode !== "press") {
          canvas.classList.toggle("press", !!pick(e));
        }
      });
      addEventListener("pointerup", () => {
        drag.mode = null;
        drag.knob = null;
        canvas.classList.remove("grabbing", "knob");
      });
      drag.targetY = HOME_Y;
      drag.targetX = HOME_X;

      function pressStartButton() {
        const cap = startBtn.getObjectByName("startCap");
        gsap
          .timeline()
          .to(cap.position, { y: 0.045, duration: 0.08, ease: "power2.in" })
          .to(cap.position, { y: 0.062, duration: 0.22, ease: "power2.out" });
        if (T.state === "playing" || T.state === "cueing") parkAndStop();
        else cueAndPlay();
      }
      function setSpeed(rpm) {
        T.rpm = rpm === 45 ? 45 : 100 / 3;
        Audio.setSpeed(T.rpm / (100 / 3));
        gsap.to(speedKnob.rotation, {
          y: rpm === 45 ? -0.9 : 0,
          duration: 0.35,
          ease: "back.out(2)",
        });
        document
          .querySelectorAll(".speed-btn")
          .forEach((b) =>
            b.setAttribute(
              "aria-pressed",
              String((rpm === 45) === (b.dataset.speed === "45")),
            ),
          );
      }
      document
        .querySelectorAll(".speed-btn")
        .forEach((b) =>
          b.addEventListener("click", () =>
            setSpeed(+b.dataset.speed === 45 ? 45 : 33),
          ),
        );

      document.getElementById("rotateBtn").addEventListener("click", () => {
        if (drag.spinning) return;
        drag.spinning = true;
        drag.targetY = HOME_Y;
        drag.targetX = HOME_X;
        drag.vx = 0;
        gsap.fromTo(
          player.rotation,
          { y: player.rotation.y },
          {
            y: HOME_Y + Math.PI * 2,
            duration: 1.4,
            ease: "power3.inOut",
            onComplete() {
              player.rotation.y = HOME_Y;
              drag.spinning = false;
            },
          },
        );
      });

      /* ══════════════════════════════════════════════════════════════
   8 · UI — carousel, player bar, seek, volume
   ══════════════════════════════════════════════════════════════ */
      const fmt = (s) => {
        s = Math.max(0, s | 0);
        return (
          String((s / 60) | 0).padStart(2, "0") +
          ":" +
          String(s % 60).padStart(2, "0")
        );
      };

      function updateNowPlaying(a) {
        document.getElementById("nowTitle").textContent = a.title;
        document.getElementById("nowArtist").textContent = a.artist;
        document.getElementById("timeDur").textContent = fmt(a.dur);
        const art = document.getElementById("nowArt");
        art.innerHTML = "";
        art.appendChild(makeCover(a, 92));
      }
      function markActiveCard(id) {
        document
          .querySelectorAll(".album")
          .forEach((el) => el.classList.toggle("active", el.dataset.id === id));
      }
      /* build the carousel (re-run when the trending feed lands) */
      function buildCarousel() {
        const rail = document.getElementById("carousel");
        rail.innerHTML = "";
        ALBUMS.forEach((a, i) => {
          const b = document.createElement("button");
          b.className = "album";
          b.dataset.id = a.id;
          b.setAttribute("aria-label", `Play ${a.title} by ${a.artist}`);
          b.style.setProperty("--disc-accent", a.label);
          const vis = document.createElement("div");
          vis.className = "album-visual";
          const disc = document.createElement("div");
          disc.className = "album-disc";
          const cover = document.createElement("div");
          cover.className = "album-cover";
          cover.dataset.idx = i;
          cover.appendChild(makeCover(a, 420));
          vis.append(disc, cover);
          const name = document.createElement("div");
          name.className = "album-name";
          name.textContent = a.title;
          const art = document.createElement("div");
          art.className = "album-artist";
          art.textContent = a.artist;
          b.append(vis, name, art);
          b.addEventListener("click", () => loadAlbum(i, true));
          rail.appendChild(b);
        });
      }
      buildCarousel();
      {
        const rail = document.getElementById("carousel");
        const step = () => rail.clientWidth * 0.7;
        document
          .getElementById("carPrev")
          .addEventListener("click", () => rail.scrollBy({ left: -step() }));
        document
          .getElementById("carNext")
          .addEventListener("click", () => rail.scrollBy({ left: step() }));
      }
      /* transport buttons */
      document.getElementById("playBtn").addEventListener("click", () => {
        if (T.state === "playing" || T.state === "cueing") parkAndStop();
        else cueAndPlay();
      });
      document
        .getElementById("prevBtn")
        .addEventListener("click", () => loadAlbum(T.albumIdx - 1, false));
      document
        .getElementById("nextBtn")
        .addEventListener("click", () => loadAlbum(T.albumIdx + 1));
      addEventListener("keydown", (e) => {
        if (e.target.matches("input,textarea")) return;
        if (e.code === "Space") {
          e.preventDefault();
          document.getElementById("playBtn").click();
        }
        if (e.code === "ArrowRight" && e.shiftKey) loadAlbum(T.albumIdx + 1);
        if (e.code === "ArrowLeft" && e.shiftKey) loadAlbum(T.albumIdx - 1);
      });

      /* seek */
      const seekEl = document.getElementById("seek");
      function seekTo(clientX) {
        const r = seekEl.getBoundingClientRect();
        const p = THREE.MathUtils.clamp((clientX - r.left) / r.width, 0, 1);
        T.time = p * album().dur;
        Audio.seekRestart();
        Audio.seek(T.time);
        document.getElementById("seekFill").style.width = p * 100 + "%";
        document.getElementById("seekDot").style.left = p * 100 + "%";
      }
      seekEl.addEventListener("pointerdown", (e) => {
        seekTo(e.clientX);
        const mv = (ev) => seekTo(ev.clientX);
        const up = () => {
          removeEventListener("pointermove", mv);
          removeEventListener("pointerup", up);
        };
        addEventListener("pointermove", mv);
        addEventListener("pointerup", up);
      });
      seekEl.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          T.time = Math.min(T.time + 10, album().dur);
        }
        if (e.key === "ArrowLeft") {
          T.time = Math.max(T.time - 10, 0);
        }
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") Audio.seek(T.time);
      });

      /* volume slider ↔ knob sync */
      const volEl = document.getElementById("vol");
      function syncVolUI(v) {
        document.getElementById("volFill").style.width = v * 100 + "%";
        document.getElementById("volDot").style.left = v * 100 + "%";
        volEl.setAttribute("aria-valuenow", Math.round(v * 100));
      }
      function volTo(clientX) {
        const r = volEl.getBoundingClientRect();
        const v = THREE.MathUtils.clamp((clientX - r.left) / r.width, 0, 1);
        Audio.setVolume(v);
        syncVolUI(v);
        volKnob.rotation.y = -(v - 0.5) * 4.2;
      }
      volEl.addEventListener("pointerdown", (e) => {
        volTo(e.clientX);
        const mv = (ev) => volTo(ev.clientX);
        const up = () => {
          removeEventListener("pointermove", mv);
          removeEventListener("pointerup", up);
        };
        addEventListener("pointermove", mv);
        addEventListener("pointerup", up);
      });
      volEl.addEventListener("keydown", (e) => {
        let v = Audio.state.volume;
        if (e.key === "ArrowRight") v = Math.min(1, v + 0.05);
        if (e.key === "ArrowLeft") v = Math.max(0, v - 0.05);
        Audio.setVolume(v);
        syncVolUI(v);
        volKnob.rotation.y = -(v - 0.5) * 4.2;
      });
      volKnob.rotation.y = -(0.75 - 0.5) * 4.2;

      /* ══════════════════════════════════════════════════════════════
   9 · FRAME LOOP
   ══════════════════════════════════════════════════════════════ */
      const clock = new THREE.Clock();
      let elapsed = 0;
      function tick() {
        const dt = Math.min(clock.getDelta(), 0.05);
        elapsed += dt;

        /* motor with inertia: accelerates hard, coasts down slow */
        const target = T.motorOn ? rpmToOmega(T.rpm) : 0;
        const k = T.motorOn ? 2.6 : 0.9;
        T.omega += (target - T.omega) * Math.min(1, k * dt);
        if (!T.motorOn && T.omega < 0.02) T.omega = 0;
        spin.rotation.y -= T.omega * dt;

        /* track clock + stylus tracking */
        if (T.state === "playing") {
          // real streamed tracks: the <audio> element is the master clock, so
          // the tonearm and progress bar track the actual playhead (and honor
          // buffering pauses). Synth records integrate against motor speed.
          if (Audio.mediaActive()) T.time = Audio.mediaTime();
          else T.time += dt * (T.rpm / (100 / 3));
          if (
            (Audio.mediaActive() && Audio.mediaEnded()) ||
            T.time >= album().dur
          ) {
            loadAlbum(T.albumIdx + 1, true);
          } else {
            armYaw.rotation.y = yawForProgress(T.time / album().dur);
            // microscopic stylus oscillation while in the groove
            armLift.rotation.x =
              LIFT_DOWN +
              Math.sin(elapsed * 41) * 0.0016 +
              Math.sin(elapsed * 7.3) * 0.0011;
            const p = T.time / album().dur;
            document.getElementById("seekFill").style.width = p * 100 + "%";
            document.getElementById("seekDot").style.left = p * 100 + "%";
            seekEl.setAttribute("aria-valuenow", Math.round(p * 100));
          }
        }
        document.getElementById("timeCur").textContent = fmt(T.time);
        led.material.emissiveIntensity +=
          ((T.motorOn ? 2.6 : 0) - led.material.emissiveIntensity) *
          Math.min(1, 8 * dt);

        /* drag-to-rotate with momentum + damping */
        if (drag.mode !== "orbit" && Math.abs(drag.vx) > 0.0004) {
          drag.targetY += drag.vx;
          drag.vx *= 0.94;
        }
        drag.targetY = THREE.MathUtils.clamp(drag.targetY, -1.15, 1.15);
        if (!drag.spinning)
          player.rotation.y +=
            (drag.targetY - player.rotation.y) * Math.min(1, 7 * dt);
        player.rotation.x +=
          (drag.targetX - player.rotation.x) * Math.min(1, 7 * dt);

        /* idle float + mouse parallax on the camera */
        if (!reduceMotion) {
          const fy = Math.sin(elapsed * 0.5) * 0.03,
            fx = Math.cos(elapsed * 0.37) * 0.02;
          camera.position.x = camHome.x + fx + mouse.x * 0.14;
          camera.position.y = camHome.y + fy - mouse.y * 0.08;
          camera.lookAt(0, 0.05, 0);
          const p = motes.geometry.attributes.position,
            seed = motes.userData.seed;
          for (let i = 0; i < seed.length; i++) {
            p.setY(i, p.getY(i) + Math.sin(elapsed * 0.6 + seed[i]) * 0.0006);
            p.setX(i, p.getX(i) + Math.cos(elapsed * 0.4 + seed[i]) * 0.0004);
          }
          p.needsUpdate = true;
        }

        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }

      /* resize + adaptive DPR */
      function resize() {
        const w = canvas.clientWidth,
          h = canvas.clientHeight;
        renderer.setSize(w, h, false);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        camera.aspect = w / h;
        camera.fov = w < 720 ? 40 : 32;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);

      /* ══════════════════════════════════════════════════════════════
   9.5 · LIVE LIBRARY — all-time famous English songs (iTunes Search API)
   A curated set of iconic records is resolved through Apple's free, open,
   CORS-friendly iTunes Search API into real 30-second previews + real album
   artwork of the actual famous recordings (full-length streaming of
   copyrighted hits isn't available for free). Each match overwrites one of
   the six built-in records in place, so the whole scene keeps working — and
   if the network is down, the procedural demo simply stays. No API key.
   ══════════════════════════════════════════════════════════════ */
      // curated icons — spanning the decades, instantly recognizable. The
      // artist is included to disambiguate the iTunes search from live cuts,
      // karaoke and covers.
      const FAMOUS = [
        { title: "Believer", artist: "Imagine Dragons" },
        { title: "Thunder", artist: "Imagine Dragons" },
        { title: "Radioactive", artist: "Imagine Dragons" },
        { title: "Demons", artist: "Imagine Dragons" },
        { title: "Natural", artist: "Imagine Dragons" },
        { title: "Cruel Summer", artist: "Taylor Swift" },
      ];

      function setSource(text, state) {
        const badge = document.getElementById("srcBadge");
        if (!badge) return;
        badge.dataset.state = state;
        document.getElementById("srcText").textContent = text;
      }

      function redrawCover(i) {
        const cont = document.querySelector(`.album-cover[data-idx="${i}"]`);
        if (cont) {
          cont.innerHTML = "";
          cont.appendChild(makeCover(ALBUMS[i], 420));
        }
        if (i === T.albumIdx) {
          updateNowPlaying(ALBUMS[i]);
          labelMat.map = ctex(makeLabel(ALBUMS[i]));
          labelMat.needsUpdate = true;
        }
      }

      // score iTunes results so we land the canonical studio recording rather
      // than a live take, remix, karaoke or tribute version.
      function pickBestMatch(results, want) {
        const T0 = want.title.toLowerCase(),
          A0 = want.artist.toLowerCase();
        const bad =
          /karaoke|tribute|cover|instrumental|as made famous|originally performed|made popular/i;
        const cand = (results || []).filter(
          (r) =>
            r.previewUrl &&
            !bad.test(`${r.trackName} ${r.artistName} ${r.collectionName || ""}`),
        );
        const score = (r) => {
          let s = 0;
          const an = r.artistName.toLowerCase(),
            tn = r.trackName.toLowerCase();
          if (an.includes(A0) || A0.includes(an)) s += 5;
          if (tn === T0) s += 5;
          else if (tn.startsWith(T0)) s += 3;
          else if (tn.includes(T0)) s += 1;
          if (/\b(live|remix|re-recorded|edit|version|remaster)/i.test(tn))
            s -= 2;
          return s;
        };
        cand.sort((a, b) => score(b) - score(a));
        return cand[0] || null;
      }

      async function loadFamous() {
        try {
          // 1 · resolve every curated song through the iTunes Search API (in
          //     parallel), keeping the best studio match for each.
          const matches = await Promise.all(
            FAMOUS.map((song) =>
              fetch(
                `https://itunes.apple.com/search?term=${encodeURIComponent(
                  song.artist + " " + song.title,
                )}&entity=song&limit=10&country=US`,
              )
                .then((r) => r.json())
                .then((j) => pickBestMatch(j.results, song))
                .catch(() => null),
            ),
          );
          if (!matches.some(Boolean)) throw new Error("no matches resolved");

          // 2 · fold each match into a record slot (keep the slot's warm label
          //     colours; swap in the real title / artist / artwork / preview).
          let got = 0;
          for (let i = 0; i < ALBUMS.length && i < matches.length; i++) {
            const r = matches[i];
            if (!r) continue;
            const slot = ALBUMS[i],
              placeholder = slot.cover;
            slot.id = "it-" + r.trackId;
            slot.title = r.trackName;
            slot.artist = r.artistName;
            slot.dur = 30; // free previews are ~30 seconds
            slot.streamUrl = r.previewUrl;
            slot.artworkUrl = (r.artworkUrl100 || "").replace(
              "100x100bb",
              "600x600bb",
            );
            slot.img = null;
            slot.cover = coverFromImage(slot, placeholder);
            if (slot.artworkUrl) {
              const img = new Image();
              img.decoding = "async";
              img.onload = () => redrawCover(i);
              img.src = slot.artworkUrl;
              slot.img = img;
            }
            got++;
          }
          if (!got) throw new Error("no matches mapped");

          // 3 · reflect the fresh library everywhere
          buildCarousel();
          updateNowPlaying(album());
          markActiveCard(album().id);
          labelMat.map = ctex(makeLabel(album()));
          labelMat.needsUpdate = true;
          setSource("Classic hits · iTunes", "live");
        } catch (err) {
          console.warn(
            "[Analogic] iTunes library unavailable — using built-in demo records.",
            err,
          );
          setSource("Demo · offline", "offline");
        }
      }

      /* ══════════════════════════════════════════════════════════════
   10 · BOOT
   ══════════════════════════════════════════════════════════════ */
      labelMat.map = ctex(makeLabel(album()));
      labelMat.needsUpdate = true;
      updateNowPlaying(album());
      markActiveCard(album().id);
      setPlayUI(false);
      resize();
      requestAnimationFrame(tick);
      document.fonts?.ready.then(() => {
        // redraw text-bearing art once fonts land
        labelMat.map = ctex(makeLabel(album()));
        labelMat.needsUpdate = true;
        updateNowPlaying(album());
        document.querySelectorAll(".album-cover").forEach((el) => {
          const i = +el.dataset.idx || 0;
          el.innerHTML = "";
          el.appendChild(makeCover(ALBUMS[i], 420));
        });
      });
      setTimeout(
        () => document.getElementById("loader").classList.add("done"),
        650,
      );

      // fetch the famous-classics library (non-blocking; demo shows instantly)
      loadFamous();
    </script>
  </body>
</html>
