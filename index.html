<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Analogic — 3D Vinyl Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   DESIGN SYSTEM — extracted from reference
   ============================================================ */
      :root {
        /* color */
        --bg-0: #f6eddb; /* warm cream, top */
        --bg-1: #efe2c8; /* warm cream, bottom */
        --ink: #2a241c; /* near-black warm ink */
        --ink-soft: #5b5142; /* secondary text */
        --ink-faint: #94886f; /* tertiary / muted labels */
        --accent: #a8763e; /* amber / brass */
        --accent-strong: #8f5f2c;
        --accent-soft: #c99e63;
        --card: #fbf5e9; /* card face */
        --card-border: #e3d5b8;
        --hairline: #ddcdae;
        --pill-bg: #f4ead6;
        --pill-active: #c69a5c;
        --pill-active-ink: #fff8ec;
        --player-bg: #fbf4e6;
        --shadow-warm: rgba(84, 60, 28, 0.16);
        --shadow-deep: rgba(52, 36, 14, 0.3);
        --focus: #8f5f2c;

        /* type */
        --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --sans: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;

        /* spacing rhythm */
        --pad-x: clamp(20px, 3.4vw, 52px);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--sans);
        color: var(--ink);
        background: linear-gradient(
          180deg,
          var(--bg-0) 0%,
          #f3e7cf 55%,
          var(--bg-1) 100%
        );
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font-family: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
        border-radius: 4px;
      }
      ::selection {
        background: #e2c893;
        color: #2a241c;
      }

      /* ============================================================
   NAVIGATION
   ============================================================ */
      .nav {
        position: relative;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px var(--pad-x) 20px;
        border-bottom: 1px solid var(--hairline);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        text-decoration: none;
        color: var(--ink);
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 50%,
          #f0e6d2 0 16%,
          #1d1913 17% 100%
        );
        position: relative;
        flex: 0 0 auto;
        box-shadow: 0 2px 6px rgba(60, 40, 15, 0.25);
      }
      .brand-mark::after {
        content: "";
        position: absolute;
        inset: 31%;
        border-radius: 50%;
        background: radial-gradient(circle, #efe4cd 0 34%, #c99e63 35% 100%);
      }
      .brand-name {
        font-family: var(--serif);
        font-size: 27px;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1;
      }
      .brand-sub {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.24em;
        color: var(--ink-faint);
        margin-top: 4px;
      }
      .nav-links {
        display: flex;
        gap: clamp(20px, 3vw, 44px);
        list-style: none;
      }
      .nav-links a {
        position: relative;
        text-decoration: none;
        color: var(--ink-soft);
        font-family: var(--serif);
        font-size: 19px;
        font-weight: 500;
        padding: 4px 2px;
        transition: color 0.25s ease;
      }
      .nav-links a:hover {
        color: var(--ink);
      }
      .nav-links a::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -9px;
        transform: translateX(-50%) scaleX(0);
        width: 100%;
        height: 2px;
        background: var(--ink);
        border-radius: 2px;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: center;
      }
      .nav-links a:hover::after {
        transform: translateX(-50%) scaleX(0.55);
      }
      .nav-links a[aria-current] {
        color: var(--ink);
      }
      .nav-links a[aria-current]::after {
        transform: translateX(-50%) scaleX(0);
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--ink);
        transform: translateX(-50%) scale(1);
        bottom: -8px;
      }
      .nav-icons {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: var(--ink);
        transition: background 0.2s ease;
      }
      .icon-btn:hover {
        background: rgba(120, 90, 45, 0.09);
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 1.6;
        fill: none;
        stroke-linecap: round;
      }

      /* ============================================================
   STAGE (hero + 3D)
   ============================================================ */
      .stage {
        position: relative;
        height: clamp(520px, 66vh, 760px);
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #gl.grabbing {
        cursor: grabbing;
      }
      #gl.knob {
        cursor: ns-resize;
      }
      #gl.press {
        cursor: pointer;
      }

      .hero-copy {
        position: absolute;
        left: var(--pad-x);
        top: clamp(36px, 8vh, 86px);
        z-index: 5;
        pointer-events: none;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.28em;
        color: var(--accent);
      }
      .eyebrow::after {
        content: "";
        width: 44px;
        height: 1px;
        background: var(--accent-soft);
      }
      .hero-title {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(34px, 3.6vw, 52px);
        line-height: 1.14;
        letter-spacing: 0.002em;
        margin-top: 18px;
        color: var(--ink);
      }

      /* speed selector */
      .speed {
        position: absolute;
        left: var(--pad-x);
        bottom: clamp(48px, 10vh, 96px);
        z-index: 5;
        background: var(--pill-bg);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 14px 16px 16px;
        box-shadow: 0 8px 22px rgba(90, 64, 26, 0.1);
      }
      .speed-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: var(--ink-faint);
        margin-bottom: 11px;
      }
      .speed-opts {
        display: flex;
        background: #ece0c6;
        border-radius: 999px;
        padding: 3px;
        gap: 3px;
      }
      .speed-btn {
        min-width: 62px;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-soft);
        transition:
          background 0.25s ease,
          color 0.25s ease,
          box-shadow 0.25s ease;
      }
      .speed-btn[aria-pressed="true"] {
        background: linear-gradient(180deg, #cda264, #b98a4a);
        color: var(--pill-active-ink);
        box-shadow:
          0 3px 8px rgba(122, 84, 32, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .speed-btn:not([aria-pressed="true"]):hover {
        color: var(--ink);
      }

      /* rotate button */
      .rotate-wrap {
        position: absolute;
        right: var(--pad-x);
        bottom: clamp(60px, 11vh, 110px);
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .rotate-btn {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        border: 1px solid var(--card-border);
        background: rgba(251, 245, 233, 0.72);
        display: grid;
        place-items: center;
        backdrop-filter: blur(3px);
        box-shadow: 0 10px 24px rgba(90, 64, 26, 0.12);
        transition:
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }
      .rotate-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(90, 64, 26, 0.18);
      }
      .rotate-btn svg {
        width: 26px;
        height: 26px;
        stroke: var(--ink);
        stroke-width: 1.6;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .rotate-btn:hover svg {
        transform: rotate(-70deg);
      }
      .rotate-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.24em;
        color: var(--ink-faint);
      }

      /* drag hint */
      .drag-hint {
        position: absolute;
        left: 50%;
        bottom: clamp(6px, 2vh, 18px);
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 5;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.26em;
        color: var(--ink-faint);
        transition: opacity 0.8s ease;
        pointer-events: none;
        white-space: nowrap;
      }
      .drag-hint.hide {
        opacity: 0;
      }
      .drag-hint .hand {
        animation: nudge 2.6s ease-in-out infinite;
        font-size: 16px;
        letter-spacing: 0;
      }
      .drag-hint .arr {
        color: #b3a789;
        letter-spacing: 0;
        font-size: 13px;
      }
      @keyframes nudge {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(9px);
        }
      }

      /* ============================================================
   MUSIC PLAYER BAR
   ============================================================ */
      .player {
        position: relative;
        z-index: 20;
        width: min(820px, calc(100% - 2 * var(--pad-x)));
        margin: 10px auto 0;
        background: var(--player-bg);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        box-shadow: 0 14px 34px rgba(90, 64, 26, 0.12);
        display: flex;
        align-items: center;
        gap: clamp(12px, 2vw, 22px);
        padding: 12px clamp(14px, 2vw, 24px);
      }
      .now {
        display: flex;
        align-items: center;
        gap: 13px;
        min-width: 0;
        flex: 0 1 240px;
        padding-right: 8px;
        border-right: 1px solid var(--hairline);
      }
      .now-art {
        width: 46px;
        height: 46px;
        border-radius: 8px;
        flex: 0 0 auto;
        box-shadow: 0 3px 8px rgba(60, 40, 15, 0.28);
        background: #222 center/cover;
        overflow: hidden;
      }
      .now-art canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .now-meta {
        min-width: 0;
      }
      .now-title {
        font-family: var(--serif);
        font-size: 17px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .now-artist {
        font-size: 12px;
        color: var(--ink-faint);
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .source-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        padding: 6px 13px 6px 11px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: rgba(251, 245, 233, 0.55);
        backdrop-filter: blur(4px);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
        width: fit-content;
        transition: opacity 0.4s ease;
      }
      .source-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(168, 118, 62, 0.5);
      }
      .source-badge[data-state="loading"] .source-dot {
        animation: srcPulse 1.3s ease-in-out infinite;
      }
      .source-badge[data-state="live"] .source-dot {
        background: #3f9d5a;
        box-shadow: 0 0 8px 1px rgba(63, 157, 90, 0.55);
      }
      .source-badge[data-state="offline"] {
        color: var(--ink-faint);
      }
      .source-badge[data-state="offline"] .source-dot {
        background: var(--ink-faint);
        box-shadow: none;
      }
      @keyframes srcPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(168, 118, 62, 0.5);
          opacity: 1;
        }
        50% {
          box-shadow: 0 0 0 5px rgba(168, 118, 62, 0);
          opacity: 0.6;
        }
      }
      .transport {
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.6vw, 20px);
      }
      .t-btn {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        transition: background 0.2s;
      }
      .t-btn:hover {
        background: rgba(120, 90, 45, 0.09);
      }
      .t-btn svg {
        width: 19px;
        height: 19px;
        fill: var(--ink);
      }
      .t-play {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, #4a3d2c, #241d13 70%);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        box-shadow:
          0 6px 16px rgba(40, 26, 8, 0.4),
          inset 0 1px 0 rgba(255, 240, 210, 0.18);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }
      .t-play:hover {
        transform: scale(1.05);
      }
      .t-play:active {
        transform: scale(0.96);
      }
      .t-play svg {
        width: 20px;
        height: 20px;
        fill: #f3e8d2;
      }
      .seek-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 120px;
      }
      .time {
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-faint);
        min-width: 36px;
      }
      .time.cur {
        color: var(--ink-soft);
      }
      .seek {
        position: relative;
        flex: 1;
        height: 18px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .seek-track {
        width: 100%;
        height: 3px;
        border-radius: 3px;
        background: #e0d2b3;
        overflow: visible;
        position: relative;
      }
      .seek-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: var(--ink);
      }
      .seek-dot {
        position: absolute;
        top: 50%;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--ink);
        transform: translate(-50%, -50%);
        left: 0%;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      .vol-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }
      .vol-wrap svg {
        width: 19px;
        height: 19px;
        stroke: var(--ink-soft);
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .vol {
        position: relative;
        width: 86px;
        height: 18px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .vol-track {
        width: 100%;
        height: 2.5px;
        border-radius: 3px;
        background: #e0d2b3;
        position: relative;
      }
      .vol-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        border-radius: 3px;
        background: var(--ink-soft);
      }
      .vol-dot {
        position: absolute;
        top: 50%;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ink);
        transform: translate(-50%, -50%);
      }

      /* ============================================================
   ALBUM CAROUSEL
   ============================================================ */
      .collection {
        position: relative;
        z-index: 10;
        padding: 34px var(--pad-x) 54px;
      }
      .collection-head {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-bottom: 22px;
      }
      .collection-title {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.28em;
        color: var(--ink);
        white-space: nowrap;
      }
      .collection-rule {
        flex: 1;
        height: 1px;
        background: var(--hairline);
      }
      .view-all {
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        color: var(--ink-soft);
        transition: color 0.2s;
      }
      .view-all:hover {
        color: var(--ink);
      }
      .view-all svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .carousel-zone {
        position: relative;
      }
      .carousel {
        display: flex;
        gap: clamp(52px, 5.2vw, 76px);
        overflow-x: auto;
        scroll-behavior: smooth;
        scrollbar-width: none;
        padding: 14px 48px 8px 6px;
      }
      .carousel::-webkit-scrollbar {
        display: none;
      }
      .album {
        flex: 0 0 auto;
        width: clamp(168px, 15.5vw, 218px);
        text-align: left;
        position: relative;
      }
      .album-visual {
        position: relative;
        height: 0;
        padding-bottom: 82%;
        margin-bottom: 14px;
      }
      .album-disc {
        position: absolute;
        top: 6%;
        left: 38%;
        width: 78%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 50%,
          #efe2c6 0 4.5%,
          var(--disc-accent, #b06c2f) 5% 17%,
          #17130d 17.5% 60%,
          #241d14 61% 74%,
          #17130d 75% 100%
        );
        box-shadow: 0 8px 18px rgba(40, 26, 8, 0.35);
        transition: transform 0.45s cubic-bezier(0.34, 1.3, 0.5, 1);
      }
      .album-disc::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 210deg,
          rgba(255, 240, 210, 0.14) 0 8%,
          transparent 12% 46%,
          rgba(255, 240, 210, 0.08) 50% 56%,
          transparent 60%
        );
      }
      .album-cover {
        position: absolute;
        inset: 0 18% 0 0;
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        border: 5px solid var(--card);
        box-shadow: 0 10px 26px rgba(70, 48, 18, 0.22);
        transition:
          transform 0.45s cubic-bezier(0.34, 1.3, 0.5, 1),
          box-shadow 0.45s ease;
      }
      .album-cover canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .album:hover .album-cover,
      .album:focus-visible .album-cover {
        transform: translateY(-9px);
        box-shadow: 0 20px 36px rgba(70, 48, 18, 0.3);
      }
      .album:hover .album-disc,
      .album:focus-visible .album-disc {
        transform: translateX(11%) rotate(28deg);
      }
      .album.active .album-cover {
        outline: 2px solid var(--accent-soft);
        outline-offset: 3px;
      }
      .album-name {
        font-family: var(--serif);
        font-size: 19px;
        font-weight: 600;
        line-height: 1.2;
      }
      .album-artist {
        font-size: 12.5px;
        color: var(--ink-faint);
        margin-top: 3px;
      }
      .car-arrow {
        position: absolute;
        top: 37%;
        z-index: 6;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(251, 245, 233, 0.9);
        border: 1px solid var(--card-border);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 20px rgba(90, 64, 26, 0.16);
        transition:
          transform 0.2s ease,
          opacity 0.3s ease;
      }
      .car-arrow:hover {
        transform: scale(1.08);
      }
      .car-arrow svg {
        width: 17px;
        height: 17px;
        stroke: var(--ink);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .car-arrow.prev {
        left: calc(var(--pad-x) * -0.55);
      }
      .car-arrow.next {
        right: calc(var(--pad-x) * -0.55);
      }
      .car-arrow[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }

      /* ============================================================
   RESPONSIVE
   ============================================================ */
      @media (max-width: 1080px) {
        .nav-links {
          display: none;
        }
        .car-arrow.prev {
          left: -8px;
        }
        .car-arrow.next {
          right: -8px;
        }
      }
      @media (max-width: 760px) {
        .stage {
          height: clamp(420px, 60vh, 560px);
        }
        .hero-title {
          font-size: 30px;
        }
        .speed {
          bottom: 14px;

    <script type="module">
      import * as THREE from "three";

      /* ══════════════════════════════════════════════════════════════
   1 · ALBUM DATA + PROCEDURAL ARTWORK
   Every cover and record label is drawn on canvas at runtime.
   ══════════════════════════════════════════════════════════════ */
      const ALBUMS = [
        {
          id: "kob",
          title: "Kind of Blue",
          artist: "Miles Davis",
          dur: 562,
          label: "#b06c2f",
          labelInk: "#2a1c0c",
          style: "jazz",
          bpm: 126,
          root: 50,
          cover: coverKindOfBlue,
        },
        {
          id: "dawn",
          title: "Dawn Chorus",
          artist: "Leila Reyes",
          dur: 341,
          label: "#c8834a",
          labelInk: "#3a2410",
          style: "ambient",
          bpm: 66,
          root: 52,
          cover: coverDawnChorus,
        },
        {
          id: "north",
          title: "Northern Lights",
          artist: "Ólafur Haukur",
          dur: 388,
          label: "#8a9b83",
          labelInk: "#1f2a1e",
          style: "piano",
          bpm: 72,
          root: 57,
          cover: coverNorthernLights,
        },
        {
          id: "mid",
          title: "Midnight Drive",
          artist: "Theo Kane",
          dur: 296,
          label: "#1c1a17",
          labelInk: "#c9a25e",
          style: "synth",
          bpm: 96,
          root: 45,
          cover: coverMidnightDrive,
        },
        {
          id: "river",
          title: "River Runs Deep",
          artist: "Sarah James",
          dur: 314,
          label: "#e9dfc8",
          labelInk: "#2b251c",
          style: "folk",
          bpm: 84,
          root: 48,
          cover: coverRiverRunsDeep,
        },
        {
          id: "red",
          title: "Echoes in Red",
          artist: "Marcus Elliot",
          dur: 329,
          label: "#8e2f22",
          labelInk: "#f2d9b8",
          style: "lofi",
          bpm: 78,
          root: 46,
          cover: coverEchoesInRed,
        },
      ];

      function cnv(w, h) {
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        return c;
      }
      function grain(x, amount = 14, count = 2600) {
        const g = x.canvas;
        x.save();
        x.globalAlpha = 0.05;
        for (let i = 0; i < count; i++) {
          const v = (Math.random() * amount) | 0;
          x.fillStyle =
            Math.random() > 0.5
              ? `rgb(${255 - v},${255 - v},${255 - v})`
              : `rgb(${v},${v},${v})`;
          x.fillRect(
            Math.random() * g.width,
            Math.random() * g.height,
            1.4,
            1.4,
          );
        }
        x.restore();
      }

      /* — Kind of Blue: near-black indigo, abstract musician silhouette, blue title — */
      function coverKindOfBlue(x, s) {
        const g = x.createLinearGradient(0, 0, s, s);
        g.addColorStop(0, "#10151d");
        g.addColorStop(0.55, "#0b0e13");
        g.addColorStop(1, "#05070a");
        x.fillStyle = g;
        x.fillRect(0, 0, s, s);
        // dim smoky glow left
        const r = x.createRadialGradient(
          s * 0.28,
          s * 0.55,
          0,
          s * 0.28,
          s * 0.55,
          s * 0.7,
        );
        r.addColorStop(0, "rgba(60,80,110,.34)");
        r.addColorStop(1, "rgba(0,0,0,0)");
        x.fillStyle = r;
        x.fillRect(0, 0, s, s);
        // silhouette: head + shoulders, trumpet raised
        x.fillStyle = "#04060a";
        x.beginPath();
        x.moveTo(s * 0.1, s);
        x.bezierCurveTo(
          s * 0.12,
          s * 0.72,
          s * 0.16,
          s * 0.6,
          s * 0.24,
          s * 0.55,
        ); // shoulder up
        x.bezierCurveTo(
          s * 0.26,
          s * 0.42,
          s * 0.24,
          s * 0.34,
          s * 0.3,
          s * 0.3,
        ); // neck→head back
        x.bezierCurveTo(
          s * 0.33,
          s * 0.22,
          s * 0.44,
          s * 0.22,
          s * 0.47,
          s * 0.3,
        ); // crown
        x.bezierCurveTo(
          s * 0.5,
          s * 0.36,
          s * 0.49,
          s * 0.42,
          s * 0.46,
          s * 0.46,
        ); // face
        x.bezierCurveTo(
          s * 0.52,
          s * 0.5,
          s * 0.58,
          s * 0.58,
          s * 0.6,
          s * 0.66,
        ); // arm out
        x.bezierCurveTo(s * 0.55, s * 0.78, s * 0.48, s * 0.9, s * 0.46, s);
        x.closePath();
        x.fill();
        // rim light on profile
        x.strokeStyle = "rgba(120,160,210,.5)";
        x.lineWidth = s * 0.006;
        x.beginPath();
        x.moveTo(s * 0.3, s * 0.3);
        x.bezierCurveTo(
          s * 0.33,
          s * 0.22,
          s * 0.44,
          s * 0.22,
          s * 0.47,
          s * 0.3,
        );
        x.bezierCurveTo(
          s * 0.5,
          s * 0.36,
          s * 0.49,
          s * 0.42,
          s * 0.46,
          s * 0.46,
        );
        x.stroke();
        // trumpet hint
        x.strokeStyle = "rgba(200,170,110,.75)";
        x.lineWidth = s * 0.012;
        x.lineCap = "round";
        x.beginPath();
        x.moveTo(s * 0.47, s * 0.44);
        x.lineTo(s * 0.62, s * 0.52);
        x.stroke();
        x.beginPath();
        x.arc(s * 0.645, s * 0.532, s * 0.028, 0, 7);
        x.strokeStyle = "rgba(200,170,110,.55)";
        x.stroke();
        // title
        x.textAlign = "left";
        x.font = `600 ${s * 0.085}px Inter, sans-serif`;
        x.fillStyle = "#e8eef6";
        x.fillText("KIND OF", s * 0.6, s * 0.2);
        x.fillStyle = "#4d84c9";
        x.font = `600 ${s * 0.115}px Inter, sans-serif`;
        const word = "BLUE";
        let cx = s * 0.6;
        for (const ch of word) {
          x.fillText(ch, cx, s * 0.315);
          cx += x.measureText(ch).width + s * 0.028;
        }
        x.font = `500 ${s * 0.037}px Inter, sans-serif`;
        x.fillStyle = "#93a6bd";
        x.fillText("MILES DAVIS", s * 0.6, s * 0.385);
        grain(x, 20);
      }

      /* — Dawn Chorus: warm gradient sky, nested arches — */
      function coverDawnChorus(x, s) {
        const g = x.createLinearGradient(0, 0, 0, s);
        g.addColorStop(0, "#e8b46a");
        g.addColorStop(0.5, "#d18a4c");
        g.addColorStop(1, "#a35a33");
        x.fillStyle = g;
        x.fillRect(0, 0, s, s);
        const arch = (w, h, col) => {
          x.fillStyle = col;
          x.beginPath();
          x.moveTo(s / 2 - w / 2, s * 0.92);
          x.lineTo(s / 2 - w / 2, s * 0.92 - h + w / 2);
          x.arc(s / 2, s * 0.92 - h + w / 2, w / 2, Math.PI, 0);
          x.lineTo(s / 2 + w / 2, s * 0.92);
          x.closePath();
          x.fill();
        };
        arch(s * 0.62, s * 0.6, "#b96f3d");
        arch(s * 0.48, s * 0.5, "#8f4a2c");
        arch(s * 0.34, s * 0.4, "#e8c07c");
        arch(s * 0.2, s * 0.3, "#6e3520");
        // sun
        x.fillStyle = "rgba(250,225,170,.9)";
        x.beginPath();
        x.arc(s / 2, s * 0.53, s * 0.045, 0, 7);
        x.fill();
        x.textAlign = "center";
        x.fillStyle = "#f7e6c8";
        x.font = `500 ${s * 0.075}px 'Cormorant Garamond', serif`;
        x.letterSpacing = s * 0.02 + "px";
        x.fillText("DAWN", s / 2, s * 0.135);
        x.fillText("CHORUS", s / 2, s * 0.215);
        x.letterSpacing = "0px";
        x.font = `500 ${s * 0.032}px Inter, sans-serif`;
        x.fillStyle = "rgba(247,230,200,.8)";
        x.fillText("LEILA REYES", s / 2, s * 0.27);
        grain(x);
      }

      /* — Northern Lights: pale nordic landscape — */
      function coverNorthernLights(x, s) {
        const g = x.createLinearGradient(0, 0, 0, s);
        g.addColorStop(0, "#dfe6d8");
        g.addColorStop(0.55, "#c3d0bd");
        g.addColorStop(1, "#9db29b");
        x.fillStyle = g;
        x.fillRect(0, 0, s, s);
        // faint aurora band
        x.save();
        x.globalAlpha = 0.3;
        const a = x.createLinearGradient(0, s * 0.18, s, s * 0.34);
        a.addColorStop(0, "rgba(140,190,160,0)");
        a.addColorStop(0.5, "rgba(150,200,180,.8)");
        a.addColorStop(1, "rgba(140,190,160,0)");
        x.fillStyle = a;
        x.beginPath();
        x.moveTo(0, s * 0.3);
        x.bezierCurveTo(s * 0.3, s * 0.2, s * 0.7, s * 0.34, s, s * 0.22);
        x.lineTo(s, s * 0.34);
        x.bezierCurveTo(s * 0.7, s * 0.46, s * 0.3, s * 0.32, 0, s * 0.42);
        x.closePath();
        x.fill();
        x.restore();
        // mountains, three planes
        const ridge = (y, amp, col) => {
          x.fillStyle = col;
          x.beginPath();
          x.moveTo(0, s);
          x.lineTo(0, y);
          for (let i = 0; i <= 8; i++) {
            const px = (i / 8) * s,
              py = y + Math.sin(i * 2.1 + amp) * amp - (i % 3 ? amp * 0.4 : 0);
            x.lineTo(px, py);
          }
          x.lineTo(s, s);
          x.closePath();
          x.fill();
        };
        ridge(s * 0.52, s * 0.05, "#7f927e");
        ridge(s * 0.62, s * 0.07, "#5d705f");
        ridge(s * 0.76, s * 0.045, "#43533f");
        // water strip
        x.fillStyle = "#b9c9b4";
        x.fillRect(0, s * 0.88, s, s * 0.12);
        x.textAlign = "left";
        x.fillStyle = "#2c3a2c";
        x.font = `600 ${s * 0.062}px Inter, sans-serif`;
        x.fillText("NORTHERN LIGHTS", s * 0.07, s * 0.13);
        x.font = `500 ${s * 0.032}px Inter, sans-serif`;
        x.fillStyle = "#4c5c4a";
        x.fillText("ÓLAFUR HAUKUR", s * 0.07, s * 0.185);
        grain(x);
      }

      /* — Midnight Drive: black field, gold scribbled circle — */
      function coverMidnightDrive(x, s) {
        const g = x.createRadialGradient(
          s / 2,
          s * 0.6,
          0,
          s / 2,
          s * 0.6,
          s * 0.8,
        );
        g.addColorStop(0, "#191713");
        g.addColorStop(1, "#0b0a08");
        x.fillStyle = g;
        x.fillRect(0, 0, s, s);
        // scribbled ring — many noisy circle passes
        x.strokeStyle = "rgba(201,162,94,.5)";
        x.lineWidth = s * 0.0035;
        x.lineCap = "round";
        const cx0 = s / 2,
          cy0 = s * 0.6,
          R = s * 0.26;
        for (let p = 0; p < 14; p++) {
          x.beginPath();
          const wob = Math.random() * s * 0.02 + s * 0.004,
            ph = Math.random() * 7;
          for (let a = 0; a <= Math.PI * 2.15; a += 0.05) {
            const rr =
              R +
              Math.sin(a * 3 + ph) * wob +
              (Math.random() - 0.5) * s * 0.006;
            const px = cx0 + Math.cos(a) * rr,
              py = cy0 + Math.sin(a) * rr * 0.96;
            a === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
          }
          x.globalAlpha = 0.25 + Math.random() * 0.4;
          x.stroke();
        }
        x.globalAlpha = 1;
        x.textAlign = "center";
        x.fillStyle = "#e9dcc2";
        x.font = `600 ${s * 0.058}px Inter, sans-serif`;
        x.fillText("MIDNIGHT DRIVE", s / 2, s * 0.14);
        x.font = `500 ${s * 0.03}px Inter, sans-serif`;
        x.fillStyle = "#8d7f63";
        x.fillText("THEO KANE", s / 2, s * 0.195);
        grain(x, 24);
      }

      /* — River Runs Deep: cream paper, ink tree — */
      function coverRiverRunsDeep(x, s) {
        x.fillStyle = "#ece3cd";
        x.fillRect(0, 0, s, s);
        const p = x.createLinearGradient(0, 0, 0, s);
        p.addColorStop(0, "rgba(255,250,238,.6)");
        p.addColorStop(1, "rgba(190,175,140,.25)");
        x.fillStyle = p;
        x.fillRect(0, 0, s, s);
        // recursive ink tree
        x.strokeStyle = "#20211c";
        x.lineCap = "round";
        function branch(bx, by, ang, len, w, depth) {
          if (depth <= 0 || len < s * 0.012) return;
          const ex = bx + Math.cos(ang) * len,
            ey = by + Math.sin(ang) * len;
          x.lineWidth = w;
          x.beginPath();
          x.moveTo(bx, by);
          x.lineTo(ex, ey);
          x.stroke();
          const n = depth > 5 ? 2 : Math.random() > 0.3 ? 2 : 3;
          for (let i = 0; i < n; i++)
            branch(
              ex,
              ey,
              ang + (Math.random() - 0.5) * 1.15,
              len * (0.62 + Math.random() * 0.2),
              w * 0.62,
              depth - 1,
            );
        }
        branch(s * 0.5, s * 0.8, -Math.PI / 2, s * 0.17, s * 0.017, 8);
        // ground line + reflection
        x.lineWidth = s * 0.004;
        x.beginPath();
        x.moveTo(s * 0.2, s * 0.805);
        x.lineTo(s * 0.8, s * 0.805);
        x.stroke();
        x.save();
        x.globalAlpha = 0.14;
        x.translate(0, s * 1.615);
        x.scale(1, -1);
        branch(s * 0.5, s * 0.8, -Math.PI / 2, s * 0.14, s * 0.014, 6);
        x.restore();
        x.textAlign = "center";
        x.fillStyle = "#2b2a24";
        x.font = `600 ${s * 0.056}px Inter, sans-serif`;
        x.fillText("RIVER RUNS DEEP", s / 2, s * 0.905);
        x.font = `500 ${s * 0.03}px Inter, sans-serif`;
        x.fillStyle = "#6d6a5c";
        x.fillText("SARAH JAMES", s / 2, s * 0.955);
        grain(x);
      }

      /* — Echoes in Red: deep red, dark profile — */
      function coverEchoesInRed(x, s) {
        const g = x.createLinearGradient(0, 0, s, s);
        g.addColorStop(0, "#9c3325");
        g.addColorStop(0.6, "#7d251a");
        g.addColorStop(1, "#571710");
        x.fillStyle = g;
        x.fillRect(0, 0, s, s);
        // profile silhouette facing left
        x.fillStyle = "#3a0f0a";
        x.beginPath();
        x.moveTo(s * 0.3, s);
        x.lineTo(s * 0.32, s * 0.62); // neck front
        x.bezierCurveTo(
          s * 0.27,
          s * 0.58,
          s * 0.28,
          s * 0.52,
          s * 0.31,
          s * 0.5,
        ); // chin
        x.bezierCurveTo(
          s * 0.28,
          s * 0.485,
          s * 0.285,
          s * 0.455,
          s * 0.315,
          s * 0.45,
        ); // lips
        x.bezierCurveTo(
          s * 0.29,
          s * 0.42,
          s * 0.3,
          s * 0.385,
          s * 0.335,
          s * 0.375,
        ); // nose
        x.bezierCurveTo(
          s * 0.325,
          s * 0.33,
          s * 0.35,
          s * 0.26,
          s * 0.43,
          s * 0.235,
        ); // brow→forehead
        x.bezierCurveTo(
          s * 0.56,
          s * 0.2,
          s * 0.66,
          s * 0.28,
          s * 0.665,
          s * 0.42,
        ); // crown/back hair
        x.bezierCurveTo(s * 0.67, s * 0.58, s * 0.62, s * 0.7, s * 0.6, s);
        x.closePath();
        x.fill();
        // warm rim on face edge
        x.strokeStyle = "rgba(240,170,120,.35)";
        x.lineWidth = s * 0.006;
        x.beginPath();
        x.moveTo(s * 0.31, s * 0.5);
        x.bezierCurveTo(
          s * 0.28,
          s * 0.485,
          s * 0.285,
          s * 0.455,
          s * 0.315,
          s * 0.45,
        );
        x.bezierCurveTo(
          s * 0.29,
          s * 0.42,
          s * 0.3,
          s * 0.385,
          s * 0.335,
          s * 0.375,
        );
        x.stroke();
        x.textAlign = "right";
        x.font = `600 ${s * 0.062}px Inter, sans-serif`;
        x.fillStyle = "rgba(240,210,170,.42)";
        x.fillText("ECHOES", s * 0.93, s * 0.145);
        x.fillText("IN RED", s * 0.93, s * 0.225);
        x.font = `500 ${s * 0.028}px Inter, sans-serif`;
        x.fillStyle = "rgba(240,210,170,.5)";
        x.fillText("MARCUS ELLIOT", s * 0.93, s * 0.28);
        grain(x, 26);
      }

      /* cover factory */
      function makeCover(album, size = 640) {
        const c = cnv(size, size),
          x = c.getContext("2d");
        album.cover(x, size);
        return c;
      }

      /* Real artwork (from the trending feed) drawn into the same square as the
         procedural covers: object-fit "cover", plus a warm vignette and film
         grain so streamed album art sits inside the analog aesthetic. While the
         remote image is still loading we fall back to the gorgeous procedural
         placeholder so nothing ever pops in empty. */
      function coverFromImage(album, placeholder) {
        return function (x, s) {
          const img = album.img;
          if (img && img.complete && img.naturalWidth) {
            const scale = Math.max(s / img.naturalWidth, s / img.naturalHeight);
            const dw = img.naturalWidth * scale,
              dh = img.naturalHeight * scale;
            x.drawImage(img, (s - dw) / 2, (s - dh) / 2, dw, dh);
            const v = x.createRadialGradient(
              s / 2,
              s / 2,
              s * 0.2,
              s / 2,
              s / 2,
              s * 0.72,
            );
            v.addColorStop(0, "rgba(0,0,0,0)");
            v.addColorStop(1, "rgba(20,12,4,0.34)");
            x.fillStyle = v;
            x.fillRect(0, 0, s, s);
            grain(x, 14, 1400);
          } else {
            placeholder(x, s);
          }
        };
      }
      const clip = (s, n) =>
        s && s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;

      /* — record center label (canvas → texture) — */
      function makeLabel(album, size = 512) {
        const c = cnv(size, size),
          x = c.getContext("2d"),
          m = size / 2;
        x.fillStyle = album.label;
        x.beginPath();
        x.arc(m, m, m, 0, 7);
        x.fill();
        // paper texture
        grain(x, 16, 1800);
        // rings
        x.strokeStyle = album.labelInk;
        x.globalAlpha = 0.65;
        x.lineWidth = size * 0.006;
        x.beginPath();
        x.arc(m, m, size * 0.46, 0, 7);
        x.stroke();
        x.globalAlpha = 0.35;
        x.lineWidth = size * 0.003;
        x.beginPath();
        x.arc(m, m, size * 0.42, 0, 7);
        x.stroke();
        x.beginPath();
        x.arc(m, m, size * 0.13, 0, 7);
        x.stroke();
        x.globalAlpha = 1;
        x.fillStyle = album.labelInk;
        x.textAlign = "center";
        x.font = `700 ${size * 0.062}px Inter, sans-serif`;
        x.fillText(clip(album.title, 20).toUpperCase(), m, size * 0.3);
        x.font = `500 ${size * 0.04}px Inter, sans-serif`;
        x.fillText(clip(album.artist, 24).toUpperCase(), m, size * 0.365);
        // arc text bottom: STEREO
        x.save();
        x.translate(m, m);
        x.font = `600 ${size * 0.036}px Inter, sans-serif`;
        const word = "· STEREO ·";
        const arcR = size * 0.3;
        const total = 0.7;
        let a0 = Math.PI / 2 - total / 2;
        for (let i = 0; i < word.length; i++) {
          const a = a0 + total * (i / (word.length - 1));
          x.save();
          x.rotate(a);
          x.translate(0, arcR);
          x.rotate(Math.PI);
          x.fillText(word[i], 0, 0);
          x.restore();
        }
        x.restore();
        x.font = `500 ${size * 0.03}px Inter, sans-serif`;
        x.fillText("33⅓ RPM · LONG PLAY", m, size * 0.66);
        x.fillText("SIDE A", m, size * 0.715);
        // spindle hole
        x.globalCompositeOperation = "destination-out";
        x.beginPath();
        x.arc(m, m, size * 0.028, 0, 7);
        x.fill();
        x.globalCompositeOperation = "source-over";
        x.strokeStyle = "rgba(0,0,0,.4)";
        x.lineWidth = 2;
        x.beginPath();
        x.arc(m, m, size * 0.028, 0, 7);
        x.stroke();
        return c;
      }

      /* ══════════════════════════════════════════════════════════════
   2 · MATERIAL TEXTURES — wood grain, vinyl grooves, brushed metal
   ══════════════════════════════════════════════════════════════ */
      function texWood(size = 1024) {
        const c = cnv(size, size),
          x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, size, size * 0.2);
        g.addColorStop(0, "#5a3a22");
        g.addColorStop(0.5, "#4c2f1a");
        g.addColorStop(1, "#5f3d24");
        x.fillStyle = g;
        x.fillRect(0, 0, size, size);
        // long grain streaks
        for (let i = 0; i < 220; i++) {
          const y = Math.random() * size,
            len = size * (0.4 + Math.random() * 0.8),
            sx = Math.random() * size - len / 2;
          const light = Math.random() > 0.5;
          x.strokeStyle = light
            ? `rgba(150,100,58,${0.05 + Math.random() * 0.12})`
            : `rgba(28,16,7,${0.06 + Math.random() * 0.14})`;
          x.lineWidth = 0.6 + Math.random() * 2.4;
          x.beginPath();
          x.moveTo(sx, y);
          for (let t = 0; t <= 1; t += 0.12)
            x.lineTo(
              sx + len * t,
              y + Math.sin(t * 9 + i) * 2.4 + (Math.random() - 0.5) * 1.6,
            );
          x.stroke();
        }
        // cathedral arcs
        for (let k = 0; k < 4; k++) {
          const cx0 = Math.random() * size,
            cy0 = Math.random() * size;
          x.strokeStyle = "rgba(30,17,8,.10)";
          for (let r = 8; r < size * 0.3; r += 7 + Math.random() * 8) {
            x.lineWidth = 1 + Math.random() * 1.6;
            x.beginPath();
            x.ellipse(cx0, cy0, r * 2.4, r * 0.5, 0, -0.4, 3.5);
            x.stroke();
          }
        }
        grain(x, 20, 3200);
        return c;
      }
      function texWoodBump(size = 512) {
        const c = cnv(size, size),
          x = c.getContext("2d");
        x.fillStyle = "#808080";
        x.fillRect(0, 0, size, size);
        for (let i = 0; i < 180; i++) {
          const y = Math.random() * size;
          x.strokeStyle = `rgba(${Math.random() > 0.5 ? 255 : 0},${Math.random() > 0.5 ? 255 : 0},0,.08)`;
          const v = Math.random() > 0.5 ? 255 : 20;
          x.strokeStyle = `rgba(${v},${v},${v},.09)`;
          x.lineWidth = 0.6 + Math.random() * 1.8;
          x.beginPath();
          x.moveTo(0, y);
          for (let t = 0; t <= 1; t += 0.1)
            x.lineTo(size * t, y + Math.sin(t * 8 + i) * 2);
          x.stroke();
        }
        return c;
      }

      /* vinyl top: color map + bump grooves. Grooves are geometry-scale
   concentric rings so specular highlights shimmer radially as the
   record spins (the texture rotates with the mesh). */
      function texVinyl(size = 2048) {
        const c = cnv(size, size),
          x = c.getContext("2d"),
          m = size / 2;
        x.fillStyle = "#0a0a0b";
        x.fillRect(0, 0, size, size);
        const rLabel = size * 0.155,
          rDead = size * 0.205,
          rOut = size * 0.492;
        // dead wax / run-out: smooth, glossier ring between grooves and label
        x.fillStyle = "#101013";
        x.beginPath();
        x.arc(m, m, rDead, 0, 7);
        x.arc(m, m, rLabel, 0, 7, true);
        x.fill("evenodd");
        x.strokeStyle = "rgba(190,190,200,.14)";
        x.lineWidth = 1; // faint run-out spiral
        x.beginPath();
        for (let a = 0; a < 22; a += 0.05)
          x.lineTo(
            m + Math.cos(a) * (rDead - 3 - a * 1.1),
            m + Math.sin(a) * (rDead - 3 - a * 1.1),
          );
        x.stroke();
        // groove sheen: alternating micro rings
        for (let r = rDead + size * 0.004; r < rOut; r += 1.35) {
          const t = (r - rDead) / (rOut - rDead);
          const band = Math.sin(t * 260) * 0.5 + 0.5; // program bands
          const v = 8 + band * 7 + Math.random() * 5;
          x.strokeStyle = `rgb(${v},${v},${v + 2})`;
          x.lineWidth = 1.1;
          x.beginPath();
          x.arc(m, m, r, 0, 7);
          x.stroke();
        }
        // track separation gaps (shinier)
        [0.3, 0.52, 0.74].forEach((t) => {
          const r = rDead + (rOut - rDead) * t;
          x.strokeStyle = "#1f1f22";
          x.lineWidth = size * 0.004;
          x.beginPath();
          x.arc(m, m, r, 0, 7);
          x.stroke();
        });
        // lead-in / lead-out
        x.strokeStyle = "#232326";
        x.lineWidth = size * 0.005;
        x.beginPath();
        x.arc(m, m, rOut - size * 0.006, 0, 7);
        x.stroke();
        x.beginPath();
        x.arc(m, m, rDead + size * 0.003, 0, 7);
        x.stroke();
        // faint hairline scratches
        x.strokeStyle = "rgba(120,120,125,.10)";
        x.lineWidth = 1;
        for (let i = 0; i < 10; i++) {
          const a0 = Math.random() * 7,
            al = 0.15 + Math.random() * 0.5,
            rr = rDead + Math.random() * (rOut - rDead);
          x.beginPath();
          x.arc(m, m, rr, a0, a0 + al);
          x.stroke();
        }
        // dust specks
        x.fillStyle = "rgba(190,185,175,.15)";
        for (let i = 0; i < 80; i++) {
          const a = Math.random() * 7,
            rr = rDead + Math.random() * (rOut - rDead);
          x.fillRect(m + Math.cos(a) * rr, m + Math.sin(a) * rr, 1.3, 1.3);
        }
        return c;
      }
      function texVinylBump(size = 1024) {
        const c = cnv(size, size),
          x = c.getContext("2d"),
          m = size / 2;
        x.fillStyle = "#808080";
        x.fillRect(0, 0, size, size);
        const rDead = size * 0.205,
          rOut = size * 0.492;
        for (let r = rDead; r < rOut; r += 2) {
          x.strokeStyle = ((r / 2) | 0) % 2 ? "#6e6e6e" : "#929292";
          x.lineWidth = 1.2;
          x.beginPath();
          x.arc(m, m, r, 0, 7);
          x.stroke();
        }
        return c;
      }

      /* platter: brushed circular aluminum roughness */
      function texBrushed(size = 1024) {
        const c = cnv(size, size),
          x = c.getContext("2d"),
          m = size / 2;
        x.fillStyle = "#b9b9bd";
        x.fillRect(0, 0, size, size);
        for (let r = 6; r < size * 0.5; r += 1.5) {
          const v = 165 + Math.random() * 70;
          x.strokeStyle = `rgba(${v},${v},${v + 4},.5)`;
          x.lineWidth = 1;
          x.beginPath();
          x.arc(m, m, r, 0, 7);
          x.stroke();
        }
        // strobe dots near rim
        x.fillStyle = "#3a3a3d";
        const n = 140,
          rr = size * 0.472;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          x.beginPath();
          x.arc(m + Math.cos(a) * rr, m + Math.sin(a) * rr, size * 0.004, 0, 7);
          x.fill();
        }
        return c;
      }

      /* rubber mat with ribbed rings */
      function texMat(size = 1024) {
        const c = cnv(size, size),
          x = c.getContext("2d"),
          m = size / 2;
        x.fillStyle = "#151412";
        x.fillRect(0, 0, size, size);
        for (let r = size * 0.06; r < size * 0.5; r += size * 0.024) {
          x.strokeStyle = "rgba(255,255,255,.05)";
          x.lineWidth = size * 0.006;
          x.beginPath();
          x.arc(m, m, r, 0, 7);
          x.stroke();
          x.strokeStyle = "rgba(0,0,0,.5)";
          x.lineWidth = size * 0.004;
          x.beginPath();
          x.arc(m, m, r + size * 0.007, 0, 7);
          x.stroke();
        }
        grain(x, 16, 1600);
        return c;
      }

      /* brass front plaque: “Analogic — STEREO TURNTABLE” */
      function texPlaque(w = 768, h = 224) {
        const c = cnv(w, h),
          x = c.getContext("2d");
        const g = x.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "#1c1610");
        g.addColorStop(1, "#0f0b07");
        x.fillStyle = g;
        x.fillRect(0, 0, w, h);
        x.strokeStyle = "#caa25e";
        x.lineWidth = 5;
        x.strokeRect(10, 10, w - 20, h - 20);
        x.strokeStyle = "rgba(202,162,94,.4)";
        x.lineWidth = 2;
        x.strokeRect(20, 20, w - 40, h - 40);
        x.textAlign = "center";
        x.fillStyle = "#e8c684";
        x.font = `600 ${h * 0.34}px 'Cormorant Garamond', serif`;
        x.fillText("Analogic", w / 2, h * 0.48);
        x.font = `600 ${h * 0.135}px Inter, sans-serif`;
        x.fillStyle = "#caa25e";
        x.save();
        x.letterSpacing = `${h * 0.06}px`;
        x.fillText("STEREO TURNTABLE", w / 2, h * 0.74);
        x.restore();
        return c;
      }

      /* deck print (light lettering silk-screened onto the wood) */
      function texDeckPrint(main, subs, w = 512, h = 256) {
        const c = cnv(w, h),
          x = c.getContext("2d");
        x.clearRect(0, 0, w, h);
        x.textAlign = "center";
        x.fillStyle = "rgba(240,228,205,.92)";
        x.font = `600 ${h * 0.19}px Inter, sans-serif`;
        x.save();
        x.letterSpacing = `${h * 0.05}px`;
        x.fillText(main, w / 2, h * 0.24);
        x.restore();
        if (subs) {
          x.font = `500 ${h * 0.13}px Inter, sans-serif`;
          x.fillStyle = "rgba(240,228,205,.75)";
          x.textAlign = "left";
          x.fillText(subs[0], w * 0.03, h * 0.92);
          x.textAlign = "right";
          x.fillText(subs[1], w * 0.97, h * 0.92);
        }
        return c;
      }

      function ctex(canvas, { srgb = true, aniso = 8, repeat } = {}) {
        const t = new THREE.CanvasTexture(canvas);
        if (srgb) t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = aniso;
        if (repeat) {
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repeat[0], repeat[1]);
        }
        return t;
      }

      /* ══════════════════════════════════════════════════════════════
   3 · RENDERER · SCENE · CAMERA · LIGHTING
   ══════════════════════════════════════════════════════════════ */
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.06;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, 2, 0.1, 60);
      const camHome = new THREE.Vector3(0.12, 2.68, 6.5);
      camera.position.copy(camHome);
      camera.lookAt(0, 0.1, 0);

      /* PMREM studio environment — a warm little light room built from
   emissive planes, prefiltered for PBR reflections. */
      {
        const envScene = new THREE.Scene();
        envScene.background = new THREE.Color("#2e2a24");
        const panel = (w, h, c, i, x, y, z, rx = 0, ry = 0) => {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({
              color: new THREE.Color(c).multiplyScalar(i),
            }),
          );
          m.position.set(x, y, z);
          m.rotation.set(rx, ry, 0);
          envScene.add(m);
        };
        panel(6, 3, "#fff2dc", 9, 0, 4.5, -2, -Math.PI / 2, 0); // big warm softbox above
        panel(2.5, 4, "#ffe9c8", 5, -5, 2, 0, 0, Math.PI / 2); // key left
        panel(2, 3, "#dfe6f2", 2.5, 5, 1.5, 1, 0, -Math.PI / 2); // cool fill right
        panel(8, 2, "#f3e3c6", 1.2, 0, 1, 5, 0, Math.PI); // front bounce
        const pm = new THREE.PMREMGenerator(renderer);
        scene.environment = pm.fromScene(envScene, 0.04).texture;
        pm.dispose();
      }

      /* lights */
      const hemi = new THREE.HemisphereLight("#fff4e0", "#8a7355", 0.55);
      scene.add(hemi);
      const key = new THREE.DirectionalLight("#fff0d8", 2.0);
      key.position.set(-4.5, 7, 4);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.camera.left = -4;
      key.shadow.camera.right = 4;
      key.shadow.camera.top = 4;
      key.shadow.camera.bottom = -4;
      key.shadow.bias = -0.0004;
      key.shadow.radius = 6;
      scene.add(key);
      const rim = new THREE.DirectionalLight("#ffe2b0", 0.9);
      rim.position.set(3.5, 4.5, -5);
      scene.add(rim);
      const fill = new THREE.DirectionalLight("#e8ecf4", 0.35);
      fill.position.set(4, 2, 4);
      scene.add(fill);

      /* contact shadow: soft radial gradient plane under the player */
      {
        const c = cnv(512, 512),
          x = c.getContext("2d");
        const g = x.createRadialGradient(256, 256, 30, 256, 256, 250);
        g.addColorStop(0, "rgba(52,36,14,.42)");
        g.addColorStop(0.55, "rgba(52,36,14,.20)");
        g.addColorStop(1, "rgba(52,36,14,0)");
        x.fillStyle = g;
        x.fillRect(0, 0, 512, 512);
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(7.6, 5.4),
          new THREE.MeshBasicMaterial({
            map: ctex(c),
            transparent: true,
            depthWrite: false,
          }),
        );
        m.rotation.x = -Math.PI / 2;
        m.position.y = -0.72;
        scene.add(m);
      }
      /* ground plane receives the crisper key-light shadow */
      {
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(30, 30),
          new THREE.ShadowMaterial({ opacity: 0.16 }),
        );
        m.rotation.x = -Math.PI / 2;
        m.position.y = -0.715;
        m.receiveShadow = true;
        scene.add(m);
      }

      /* ══════════════════════════════════════════════════════════════
   4 · THE TURNTABLE — every part procedural geometry
   ══════════════════════════════════════════════════════════════ */
      const player = new THREE.Group(); // drag-to-rotate root
      scene.add(player);

      const M = {
        wood: new THREE.MeshPhysicalMaterial({

      /* stylus world-target solver: find yaw φ so the stylus lands at
   radius r from the platter centre (front-side branch). */
      function yawForRadius(r) {
        const px = ARM.pivot.x - PLATTER_C.x,
          pz = ARM.pivot.z - PLATTER_C.z;
        let best = 0,
          bestErr = 1e9;
        for (let phi = 1.2; phi < 3.3; phi += 0.002) {
          const sx = px - ARM.L * Math.sin(phi),
            sz = pz - ARM.L * Math.cos(phi);
          const err = Math.abs(Math.hypot(sx, sz) - r);
          if (err < bestErr && phi > 1.9) {
            bestErr = err;
            best = phi;
          }
        }
        return best;
      }
      const YAW_REST = 2.72; // tube seats in the rest clip

      /* silk-screened deck lettering (planes flush with the wood) */
      function deckPrint(canvasEl, w, x, z, opts = {}) {

      /* dust motes drifting in the key light */
      const motes = (() => {
        const n = 140,
          g = new THREE.BufferGeometry();

        for (let i = 0; i < n; i++) {
          pos[i * 3] = (Math.random() - 0.5) * 6;

          seed[i] = Math.random() * 100;

        const p = new THREE.Points(
          g,
